<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- به مرورگر می‌گه این سند تیره‌ست — روی برخی نسخه‌های Chromium حتی خودِ
     پسِ‌زمینهٔ پیش‌فرضِ UA (قبل از اجرای هر CSS/JSای) رو هم تیره می‌کنه. -->
<meta name="color-scheme" content="dark">
<!-- زودترین چیزِ ممکن در <head>: پس‌زمینهٔ تیره را همون لحظهٔ اول ست می‌کند
     تا اگر مرورگر پیش از اجرای اسکریپتِ زیر یک فریم پینت کرد، سفیدِ
     پیش‌فرضِ UA دیده نشه. -->
<style>html, body { background: #000; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Galaxy</title>

<!-- باید همیشه اولین اسکریپت در <head> بماند -->
<script src="void-tab-router.js"></script>
<style>

/* --------------------------------------------------------------------- */
/* لینک‌های پرکاربرد — زوم پایدار در حالت کلاپس (حل مشکل انیمیشن زوم) */
/* این CSS داخل void-dissolve.js هم اعمال شده (pointer-events: none)    */
/* --------------------------------------------------------------------- */
.ai-ts-tile {
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  will-change: transform;
}

.ai-ts-tile:hover {
  transform: scale(1.08);
  z-index: 20;
}

/* اگر می‌خواهی لینک‌ها کمی taller هم باشند (اختیاری) */
.ai-ts-tile {
  height: 58px;
  min-height: 58px;
}
<style>
    * { box-sizing: border-box; }

    /* --void-dock-w یک‌بار تعریف می‌شود و در دو جا مصرف می‌شود: عرضِ خودِ
       Today، و فضایی که Stage برایش کنار می‌گذارد. این‌طوری «فاصلهٔ کافی»
       یک محاسبهٔ ریاضی‌ست که همیشه درست است، نه یک عددِ حدسی که فقط در چند
       نقطهٔ نمونه (مثلاً ۱۰۲۴ یا ۱۲۸۰) تست و تاییدش کنیم و جای دیگری از
       قلم بیفتد. */
    :root {
        --void-dock-w: clamp(200px, 20vw, 300px);
        --void-dock-offset: 16px;   /* فاصلهٔ Today از لبهٔ ویوپورت */
        --void-dock-gap: 24px;      /* حداقل فاصلهٔ نفس‌کشیدن بینِ Today و Stage */
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }

    body {
        position: relative;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
    }

    /* Boot: kill motion until router + storage state applied (no layout thrash on new tab) */
    html.void-booting *,
    html.void-booting *::before,
    html.void-booting *::after {
        transition: none !important;
        animation: none !important;
    }


    #starfield {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
    }

    .space-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(
                ellipse at center,
                transparent 0%,
                rgba(0, 0, 0, 0.08) 45%,
                rgba(0, 0, 0, 0.48) 100%
            );
    }

    @media (prefers-reduced-motion: reduce) {
        #starfield { animation: none; }
    }

    /* ---- Top-right chrome: Menu · Gmail · Account (always visible) ---- */
    #ai-ntp-quickbar {
        position: fixed;
        top: 14px;
        right: 14px;
        left: auto;
        z-index: 800;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px;
        border-radius: 12px;
        background: rgba(20, 22, 30, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.14);
        opacity: 1;
        overflow: visible;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        transition: left 0.2s ease, right 0.2s ease;
    }
    #ai-ntp-quickbar[data-side="left"] { left: 14px; right: auto; }
    #ai-ntp-quickbar[data-side="right"] { right: 14px; left: auto; }
    #ai-ntp-quickbar > a,
    #ai-ntp-quickbar > button,
    #ai-ntp-menu-btn,
    #ai-ntp-apps-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: none;
        background: transparent;
        color: #F3F4F6;
        font-size: 15px;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    #ai-ntp-quickbar > a:hover,
    #ai-ntp-quickbar > button:hover,
    #ai-ntp-menu-btn:hover,
    #ai-ntp-menu.open #ai-ntp-menu-btn,
    #ai-ntp-apps-btn:hover,
    #ai-ntp-apps-wrap.open #ai-ntp-apps-btn {
        background: rgba(255, 255, 255, 0.12);
        transform: scale(1.1);
    }
    /* رنگِ کهربایی/نارنجیِ سیارهٔ حلقه‌دار — تنها آیکونِ رنگی توی کوییک‌بار،
       عمداً برای جلبِ توجه، هم‌راستا با پالتِ کهربایی‌ای که جاهای دیگهٔ صفحه
       (رویدادهای امروز، Goals و...) هم استفاده می‌کنن. */
    #ai-ntp-apps-btn { color: rgba(251, 191, 36, 0.92); }
    #ai-ntp-apps-btn:hover,
    #ai-ntp-apps-wrap.open #ai-ntp-apps-btn {
        color: #FBBF24;
        background: rgba(251, 191, 36, 0.14);
    }

    /* ---- Center stage: search + shortcuts + topsites ---- */
    /* left:0/right:0/margin:auto به‌جای left:50%+transform: هر ancestorِ
       transform-دار، containing-block رو برای فرزندانِ position:fixed
       عوض می‌کنه — یعنی از الان که Today (#ai-void-todo-dock) به‌عنوانِ
       فرزندِ همین استیج زندگی می‌کنه (برای چیدمانِ موبایل)، اگه خودِ استیج
       transform داشت، Today (که رویِ دسکتاپ همچنان position:fixed هست)
       دیگه نسبت به کلِ صفحه فیکس نمی‌موند، نسبت به همین باکسِ کوچیکِ استیج
       فیکس می‌شد و رویِ نوار جستجو می‌افتاد. این روشِ سنترکردن دقیقاً همون
       نتیجه رو بدونِ transform می‌ده، پس این باگ اصلاً پیش نمی‌آد.

       عرض: به‌جای یه max-width ثابت (۶۴۰px) که در پنجره‌های نه‌چندان‌بزرگ
       (۱۰۰۰ تا ۱۳۰۰px) به‌سادگی با Todayِ کنارش تصادم می‌کنه، همون فضایی که
       Today واقعاً اشغال می‌کنه (offset + عرضِ متغیرش + gap) از هر دو طرف
       کم می‌شه. نتیجه: هیچ عرضی وجود نداره که این دو تا با هم قاطی بشن —
       نه فقط چند نقطهٔ نمونه که تستش کردیم. */
    #ai-void-stage {
        position: fixed;
        left: 0; right: 0; margin: 0 auto;
        top: max(88px, 18vh);
        z-index: 40;
        width: min(640px, calc(100vw - 2 * (var(--void-dock-offset) + var(--void-dock-w) + var(--void-dock-gap))));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        pointer-events: none;
    }
    #ai-void-stage > * { pointer-events: auto; }

    /* Multi-engine search — always LTR so logo/nav never mirror-jump in RTL locales */
    #ai-void-search {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        direction: ltr;
        unicode-bidi: isolate;
    }
    .ai-void-search-brand-row {
        display: flex;
        flex-direction: row; /* never row-reverse under [dir=rtl] */
        align-items: center;
        gap: 10px;
        user-select: none;
        direction: ltr;
        unicode-bidi: isolate;
    }
    .ai-void-search-nav {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        color: rgba(226,232,255,0.75);
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        display: grid;
        place-items: center;
        transition: background .15s ease, color .15s ease, transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-void-search-nav:hover {
        background: rgba(255,255,255,0.12);
        color: #fff;
        transform: scale(1.14);
    }
    #ai-void-search-brand {
        --engine-accent: #8ab4f8;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        direction: ltr;
        unicode-bidi: isolate;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(12, 16, 32, 0.45);
        border: 1px solid rgba(165, 180, 252, 0.18);
        cursor: pointer;
        transition: border-color .2s ease, box-shadow .2s ease;
    }
    #ai-void-search-brand:hover {
        border-color: rgba(165, 180, 252, 0.35);
        box-shadow: 0 0 0 1px rgba(165,180,252,0.08), 0 8px 24px rgba(0,0,0,0.25);
    }
    .ai-void-search-brand-pulse { animation: aiVoidBrandPulse .35s ease; }
    @keyframes aiVoidBrandPulse {
        0% { transform: scale(0.98); }
        100% { transform: scale(1); }
    }
    /* Engine mark — no accent orb; stacked SVG layers toggled by data-engine */
    .ai-void-search-brand-mark {
        position: relative;
        display: block;
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
        overflow: hidden;
        background: none;
        box-shadow: none;
        border-radius: 0;
        color: rgba(226, 232, 255, 0.55);
        text-decoration: none;
        cursor: pointer;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    #ai-void-search-brand:hover .ai-void-search-brand-mark {
        transform: scale(1.12);
    }
    .ai-void-search-brand-mark .mark {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
        /* keep rendered — never display:none */
        object-fit: contain;
        display: block;
    }
    .ai-void-search-brand-mark[data-engine="google"] .mark[data-mark="google"],
    .ai-void-search-brand-mark[data-engine="bing"] .mark[data-mark="bing"],
    .ai-void-search-brand-mark[data-engine="duckduckgo"] .mark[data-mark="duckduckgo"],
    .ai-void-search-brand-mark[data-engine="brave"] .mark[data-mark="brave"],
    .ai-void-search-brand-mark[data-engine="generic"] .mark[data-mark="generic"] {
        opacity: 1;
    }
    .ai-void-search-brand-mark:focus-visible {
        outline: 2px solid rgba(99, 102, 241, 0.85);
        outline-offset: 3px;
    }
    #ai-void-search-brand-name {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
        color: #F1F5FF;
        text-shadow: 0 1px 12px rgba(0,0,0,0.45);
    }
    .ai-void-search-box {
        width: 100%;
        max-width: 584px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
        direction: ltr;
        unicode-bidi: isolate;
        padding: 6px 8px 6px 16px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow:
            0 1px 2px rgba(0,0,0,0.08),
            0 8px 28px rgba(0,0,0,0.28),
            0 0 0 1px rgba(165,180,252,0.08);
        transition: box-shadow .2s ease;
    }
    .ai-void-search-box:focus-within {
        box-shadow:
            0 1px 2px rgba(0,0,0,0.06),
            0 12px 36px rgba(0,0,0,0.35),
            0 0 0 2px color-mix(in srgb, var(--engine-accent, #8ab4f8) 55%, transparent);
    }
    .ai-void-search-icon {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        opacity: 0.45;
        color: #3c4043;
    }
    #ai-void-search-input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #202124;
        padding: 10px 4px;
    }
    #ai-void-search-input::placeholder { color: #80868b; }
    /* AI mode pill — clear Off / On (previous polished design) */
    #ai-void-search-mode {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 32px;
        padding: 0 11px 0 9px;
        border-radius: 999px;
        border: 1px solid rgba(60, 64, 67, 0.18);
        background: rgba(60, 64, 67, 0.06);
        color: #5f6368;
        font: 600 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        user-select: none;
        transition: background .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease, transform .12s ease;
    }
    #ai-void-search-mode[hidden] { display: none !important; }
    #ai-void-search-mode .ai-mode-glyph {
        width: 14px; height: 14px; display: grid; place-items: center; flex: 0 0 14px;
    }
    #ai-void-search-mode .ai-mode-glyph svg { width: 14px; height: 14px; display: block; }
    #ai-void-search-mode .ai-mode-label { line-height: 1; }
    #ai-void-search-mode .ai-mode-state {
        font-size: 9px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.75;
        padding: 2px 5px; border-radius: 999px;
        background: rgba(60, 64, 67, 0.1); color: inherit;
    }
    #ai-void-search-mode:hover {
        background: rgba(60, 64, 67, 0.1);
        border-color: rgba(60, 64, 67, 0.28);
        color: #3c4043;
    }
    #ai-void-search-mode:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--engine-accent, #8ab4f8) 70%, transparent);
        outline-offset: 2px;
    }
    #ai-void-search-mode.is-ai {
        background: linear-gradient(135deg, #1a73e8 0%, #8ab4f8 55%, #c58af9 100%);
        border-color: transparent;
        color: #fff;
        box-shadow:
            0 1px 2px rgba(26, 115, 232, 0.25),
            0 0 0 1px rgba(255, 255, 255, 0.12) inset,
            0 6px 16px rgba(138, 180, 248, 0.35);
    }
    #ai-void-search-mode.is-ai .ai-mode-state {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
        opacity: 1;
    }
    #ai-void-search-mode.is-ai:hover {
        filter: brightness(1.06);
        color: #fff;
        background: linear-gradient(135deg, #1a73e8 0%, #8ab4f8 55%, #c58af9 100%);
        border-color: transparent;
    }
    /* Search submit — magnifier */
    #ai-void-search-go {
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
        color: #e2e8f0;
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 1px 2px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.06) inset;
        transition: background .18s ease, transform .14s ease, box-shadow .18s ease, color .18s ease;
    }
    #ai-void-search-go svg { width: 18px; height: 18px; display: block; pointer-events: none; }
    #ai-void-search-go:hover {
        background: linear-gradient(160deg, #334155 0%, #1e293b 100%);
        transform: scale(1.05);
        color: #fff;
    }
    #ai-void-search-go:active { transform: scale(0.96); }
    #ai-void-search[data-mode="ai"] #ai-void-search-go {
        background: linear-gradient(160deg, #1a73e8 0%, #5b8def 100%);
        color: #fff;
        box-shadow: 0 2px 10px rgba(26, 115, 232, 0.35);
    }
    #ai-void-search[data-mode="ai"] #ai-void-search-go:hover {
        background: linear-gradient(160deg, #1967d2 0%, #4c7fe0 100%);
        color: #fff;
    }
    #ai-void-search-dots {
        display: flex;
        gap: 7px;
        align-items: center;
        justify-content: center;
        min-height: 12px;
    }
    .ai-void-search-dot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(226, 232, 255, 0.28);
        cursor: pointer;
        transition: transform .15s ease, background .15s ease;
    }
    .ai-void-search-dot.is-active {
        background: var(--engine-accent, #a5b4fc);
        transform: scale(1.35);
        box-shadow: 0 0 8px color-mix(in srgb, var(--engine-accent, #a5b4fc) 60%, transparent);
    }

    /* Apps ▦ inside quickbar (NOT under search) */
    #ai-ntp-apps-wrap { position: relative; z-index: 3; }
    #ai-ntp-apps-btn {
        width: 32px; height: 32px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 8px; border: none; background: transparent;
        color: #F3F4F6; font-size: 15px; cursor: pointer;
    }
    #ai-ntp-apps-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 220px;
        max-width: min(340px, calc(100vw - 24px));
        background: rgba(20, 22, 30, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 10px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transform-origin: top right;
        pointer-events: none;
        transition: opacity 0.16s ease, transform 0.16s ease, visibility 0.16s;
        z-index: 810;
    }
    #ai-ntp-apps-wrap.open #ai-ntp-apps-panel {
        opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto;
    }
    #ai-ntp-quickbar[data-side="left"] #ai-ntp-apps-panel {
        left: 0; right: auto; transform-origin: top left;
    }
    #ai-void-apps {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        padding: 0; margin: 0; opacity: 1; min-height: 0;
    }
    .ai-void-app {
        width: auto; min-width: 0;
        display: flex; flex-direction: column; align-items: center;
        gap: 4px; padding: 8px 4px 6px; border-radius: 12px;
        text-decoration: none; color: #E5E7EB;
        border: 1px solid transparent; background: transparent;
        cursor: pointer; font: inherit;
        transition: background .15s ease, border-color .15s ease, transform .12s ease;
    }
    .ai-void-app:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.07);
        transform: translateY(-1px);
    }
    .ai-void-app-icon {
        width: 26px;
        height: 26px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: rgba(226, 232, 255, 0.82);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .ai-void-app:hover .ai-void-app-icon,
    .ai-void-app:focus-within .ai-void-app-icon {
        transform: scale(1.16);
    }
    .ai-void-app-icon img,
    .ai-void-app-icon svg {
        width: 14px;
        height: 14px;
        object-fit: contain;
    }
    /* Brand identity is a hint of color in the glyph only — no filled blocks */
    .ai-void-app-icon.is-mail { color: #f28b82; }
    .ai-void-app-icon.is-drive { color: #7ecb92; }
    .ai-void-app-icon.is-cal { color: #8ab4f8; }
    .ai-void-app-icon.is-photos { color: #fdd663; }
    .ai-void-app-icon.is-custom { color: rgba(226, 232, 255, 0.82); }
    .ai-void-app-label {
        font-size: 10px; color: rgba(226, 232, 255, 0.7);
        max-width: 100%; width: 100%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    }
    .ai-void-app-add {
        opacity: 0.55;
    }
    .ai-void-app-add:hover { opacity: 1; }
    .ai-void-app-add .ai-void-app-icon {
        background: rgba(255,255,255,0.04);
        border-style: dashed;
        color: rgba(226,232,255,0.6);
        font-size: 15px;
        font-weight: 400;
    }
    .ai-void-app { position: relative; }
    .ai-void-app-edit {
        position: absolute;
        top: 1px;
        inset-inline-end: 1px;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 6px;
        background: rgba(10, 14, 28, 0.82);
        color: #fff;
        font-size: 9px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        opacity: 0;
        transform: translateY(-2px);
        transition: opacity .15s ease, transform .15s ease, background .15s ease;
    }

    /* Menu nested inside quickbar cluster */

    /* ---- Today's Echo (collapsible zen card) ---- */
    #ai-void-echo {
        width: 100%; max-width: 360px; border-radius: 16px;
        background: rgba(8, 12, 28, 0.42);
        /* کادرِ خودِ Echo، نه یه لکهٔ تازه — هویتِ نقره‌ای رویِ همون مرزِ
           موجود، هم‌الگو با کارِ Today. */
        border: 1px solid rgba(203, 213, 225, 0.32);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28), 0 0 20px rgba(203, 213, 225, 0.14);
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        overflow: hidden; transition: opacity 0.25s ease, max-height 0.28s cubic-bezier(.16,1,.3,1);
    }
    #ai-void-echo[hidden] { display: none !important; }
    #ai-void-echo.is-collapsed { max-height: 40px; }
    /* همون منطقِ نئونِ Today، اینجا با نقره‌ایِ Echo. */
    #ai-void-echo.is-collapsed:not(.ai-void-is-dissolved) {
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28), 0 0 22px rgba(203, 213, 225, .34);
    }
    #ai-void-echo:not(.is-collapsed) { max-height: 320px; }
    #ai-void-echo.is-collapsed .ai-void-echo-content { display: none; }
    .ai-void-echo-handle {
        display: flex; align-items: center; gap: 8px; padding: 9px 12px;
        cursor: pointer; user-select: none; color: rgba(199, 210, 254, 0.85);
        /* همون تقسیم‌کنندهٔ فیزیکیِ موجود، فقط رنگِ نقره‌ایِ Echo رو گرفته. */
        border-bottom: 1px solid rgba(203, 213, 225, 0.28);
    }
    #ai-void-echo.is-collapsed .ai-void-echo-handle { border-bottom-color: transparent; }
    .ai-void-echo-handle:hover { background: rgba(255, 255, 255, 0.04); }
    .ai-void-echo-icon { width: 18px; height: 18px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; color: rgba(167, 139, 250, 0.9); }
    .ai-void-echo-icon svg { width: 16px; height: 16px; display: block; }
    .ai-void-echo-title {
        flex: 1 1 auto; font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
        color: rgba(199, 210, 254, 0.78);
        min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ai-void-echo-count { font-size: 10.5px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: rgba(167, 139, 250, 0.18); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, 0.28); }
    .ai-void-echo-count[hidden] { display: none !important; }
    .ai-void-echo-chevron { font-size: 11px; opacity: 0.65; transition: transform 0.22s ease; flex: 0 0 auto; }
    #ai-void-echo:not(.is-collapsed) .ai-void-echo-chevron { transform: rotate(180deg); }
    .ai-void-echo-content { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 12px 12px; }
    .ai-void-echo-body { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; align-self: stretch; }
    /* Echo v2 — Commitments / Other columns */
    .ai-void-echo-col { flex: 1 1 130px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 7px 9px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
    .ai-void-echo-col-commit { border-color: rgba(167,139,250,0.20); }
    .ai-void-echo-col-noise .ai-void-echo-chip { opacity: 0.85; }
    .ai-void-echo-col-title { font-size: 9.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(199,210,254,0.55); }
    .ai-void-echo-col .ai-void-echo-chip { font-size: 12px; padding: 3px 9px; max-width: 100%; }
    .ai-void-echo-ratio { margin-top: 2px; font-size: 10.5px; font-weight: 700; color: rgba(167,243,208,0.85); }
    .ai-void-echo-chip { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: rgba(255,255,255,0.92); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
    .ai-void-echo-chip--done { background: rgba(16,185,129,0.14); border-color: rgba(16,185,129,0.28); color: #6ee7b7; }
    .ai-void-echo-chip--event { background: rgba(56,189,248,0.12); border-color: rgba(56,189,248,0.26); color: #7dd3fc; }
    .ai-void-echo-chip--missed { background: rgba(251,146,60,0.12); border-color: rgba(251,146,60,0.28); color: #fdba74; }
    .ai-void-echo-chip--progress { background: rgba(52,211,153,0.14); border-color: rgba(52,211,153,0.30); color: #6ee7b7; }
    .ai-void-echo-chip--cleared { background: rgba(167,139,250,0.12); border-color: rgba(167,139,250,0.24); color: #c4b5fd; }
    .ai-void-echo-pattern { font-size: 11px; font-weight: 500; color: rgba(199,210,254,0.52); text-align: center; line-height: 1.35; max-width: 100%; }
    .ai-void-echo-pattern[hidden] { display: none !important; }
    body.ai-focus-mode #ai-void-echo { opacity: 0 !important; pointer-events: none !important; }

    /* Todo dock — z-index رو حالا حتی از خودِ استیجِ اصلی (۴۰) هم پایین‌تر
       گذاشتیم (۳۰): طبقِ خواستِ کاربر، وقتی داک باز/گسترده می‌شه و با سرچ/
       Echo/Goals هم‌پوشانی پیدا می‌کنه، باید *زیرِ* اون‌ها بمونه، نه روشون -
       کوییک‌بار (۸۰۰) و دیالوگِ ویرایش (۹۹۹۹۹۹) هنوز از همه بالاترن. */
    #ai-void-todo-dock {
        position: fixed; top: 22%; z-index: 30;
        display: block !important; visibility: visible !important; opacity: 1 !important;
        pointer-events: auto !important;
        width: var(--void-dock-w);
        max-height: min(64vh, 520px);
        color: #EEF2FF;
        background: rgba(10, 14, 28, .7);
        /* کادرِ خودِ پنل، نه یه لکهٔ تازه — هویتِ آبیِ Today رو رویِ مرزِ
           خودِ داک می‌ذاریم؛ همون قابی که از قبل هست، فقط رنگش. */
        border: 1px solid rgba(56, 189, 248, .38);
        border-radius: 14px;
        backdrop-filter: blur(18px) saturate(1.15);
        -webkit-backdrop-filter: blur(18px) saturate(1.15);
        box-shadow: 0 15px 42px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06), 0 0 20px rgba(56, 189, 248, .16);
        overflow: hidden;
        transition: box-shadow .2s ease, opacity .2s ease, max-height .28s cubic-bezier(.16,1,.3,1);
    }
    /* قانونِ بالا با !important همیشه display/visibility/opacity رو force
       می‌کنه — یعنی خاموش‌کردنِ داک از منوی سه‌تایی (که با dock.hidden=true
       کار می‌کنه) بدونِ این override اصلاً اثر نداشت. چون [hidden] یه
       سلکتورِ خاص‌ترـه (attribute selector اضافه)، این قانون روی قانونِ
       بالا برنده می‌شه. */
    #ai-void-todo-dock[hidden] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
    }
    /* همین منطق، این‌بار کلیدش نه dock.hidden بلکه attributeِ
       data-void-boot-dissolved است — که void-tab-router.js پیش از هر پینتی
       (قبل از این‌که حتی یک اسکریپتِ دیگه اجرا بشه) روی dock می‌ذاره اگه
       Today از storage به‌عنوانِ «ستاره‌شده» خونده بشه. این یه لایهٔ دومِ
       دفاعیه: صرف‌نظر از این‌که بعداً کدوم اسکریپت (void-dissolve.js یا
       void-tab-todo.js) با چه ترتیبی و چه سرعتی dock.hidden رو ست/آن‌ست
       می‌کنه، تا وقتی این attribute پاک نشده (که فقط بعد از تاییدِ نهاییِ
       واقعاً-dissolved-بودن پاک می‌شه)، دیدن شدنِ داک به‌شکلِ عادی/جمع‌شده
       از نظرِ CSS اصلاً ممکن نیست — یعنی حتی اگه یه race باعث بشه
       dock.hidden لحظه‌ای false بشه، این قانون بازم مخفیش نگه می‌داره. */
    #ai-void-todo-dock[data-void-boot-dissolved="1"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
    }
    #ai-void-todo-dock[data-side="right"] { right: var(--void-dock-offset); }
    #ai-void-todo-dock[data-side="left"] { left: var(--void-dock-offset); }
    #ai-void-todo-dock:hover { box-shadow: 0 18px 48px rgba(0,0,0,.48), 0 0 0 1px rgba(165,180,252,.13); }
    #ai-void-todo-dock.is-collapsed { max-height: 42px; }
    /* لحظه‌ای که جمع می‌شه (کلاپسِ سادهٔ هرروزه، نه دیسالوِ ستاره‌ای)، همون
       هویتِ آبیِ Today به‌شکلِ یه سایهٔ نئونیِ واضح‌تر برمی‌گرده — یه نشونهٔ
       بصریِ ملایم که «فقط جمع شده، نه محو» رو از حالتِ dissolve متمایز می‌کنه. */
    #ai-void-todo-dock.is-collapsed:not(.ai-void-is-dissolved) {
        box-shadow: 0 15px 42px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06), 0 0 22px rgba(56, 189, 248, .38);
    }
    #ai-void-todo-dock.is-collapsed .ai-void-agenda-body { display: none; }
    #ai-void-todo-dock.is-collapsed .ai-void-todo-head { border-bottom-color: transparent; }
    .ai-void-todo-head {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 10px;
        /* تقسیم‌کنندهٔ هدر/بدنه که از قبل هست، فقط رنگِ آبیِ Today رو گرفته —
           نه یه لکهٔ تازه، بلکه همون مرزِ فیزیکیِ موجود. */
        border-bottom: 1px solid rgba(56, 189, 248, .32);
        cursor: pointer; user-select: none;
    }
    .ai-void-todo-head:active { cursor: grabbing; }
    .ai-void-todo-title { font-size: 12px; font-weight: 800; letter-spacing: .02em; }
    .ai-void-todo-count { margin-inline-start: auto; font-size: 10px; color: #C7D2FE; }
    .ai-void-todo-chevron {
        width: 18px; height: 18px; flex: 0 0 18px;
        display: grid; place-items: center;
        color: #C7D2FE; font-size: 10px;
        transition: transform .22s ease; opacity: .85;
    }
    #ai-void-todo-dock:not(.is-collapsed) .ai-void-todo-chevron { transform: rotate(180deg); }
    .ai-void-todo-side {
        width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px;
        background: transparent; color: #C7D2FE; cursor: pointer;
    }
    .ai-void-todo-side:hover { background: rgba(255,255,255,.09); }
    .ai-void-agenda-body {
        display: flex; flex-direction: column; gap: 10px;
        max-height: calc(min(64vh, 520px) - 42px);
        padding: 9px 10px 10px; overflow: auto;
        /* اسکرول‌بارِ نازک و هم‌رنگِ تمِ دارک به‌جای اسکرول‌بارِ خاکستریِ
           پیش‌فرضِ مرورگر؛ فقط موقعِ هاور/اسکرول پررنگ می‌شه. */
        scrollbar-width: thin;
        scrollbar-color: rgba(165, 180, 252, .3) transparent;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
        mask-image: linear-gradient(to bottom, transparent 0, #000 10px, #000 calc(100% - 10px), transparent 100%);
    }
    .ai-void-agenda-body::-webkit-scrollbar { width: 6px; }
    .ai-void-agenda-body::-webkit-scrollbar-track { background: transparent; }
    .ai-void-agenda-body::-webkit-scrollbar-thumb {
        background: rgba(165, 180, 252, .22);
        border-radius: 999px;
        border: 1.5px solid transparent;
        background-clip: padding-box;
    }
    .ai-void-agenda-body:hover::-webkit-scrollbar-thumb,
    .ai-void-agenda-body::-webkit-scrollbar-thumb:hover {
        background: rgba(165, 180, 252, .5);
        background-clip: padding-box;
    }
    /* سرِ بخش: تاریخ (میلادی + شمسی) و سن — دقیقاً همان منطقِ خودِ ساعت/تقویمِ
       ویجتِ اصلی، اما مستقل محاسبه می‌شود چون پنلِ ساعتِ اصلی فقط وقتی باز است
       به‌روزرسانی می‌شود، و این داک باید همیشه (حتی بسته) درست باشد. */
    .ai-void-agenda-datehead {
        display: flex; flex-direction: column; gap: 3px;
        padding-bottom: 8px;
    }
    /* خطِ میلادی: دو سطرِ مرتب — روزِ هفته به‌صورتِ برچسبِ کوچک، زیرش
       تاریخِ کامل با سال. سال کمی کم‌رنگ‌تر است تا روز/ماه غالب بمانند، ولی
       همیشه دیده می‌شود. عرضِ داک تا ۲۰۰px هم بدونِ شکستنِ ناجور جا می‌شود. */
    .ai-void-agenda-date-primary { display: flex; flex-direction: column; gap: 1px; color: #F1F5FF; letter-spacing: .01em; }
    .ai-void-agenda-date-weekday {
        font-size: 9.5px; font-weight: 700; text-transform: uppercase;
        letter-spacing: .14em; color: rgba(125, 211, 252, 0.8);
    }
    .ai-void-agenda-date-full { font-size: 13px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
    .ai-void-agenda-date-year { font-weight: 600; color: rgba(241, 245, 255, 0.62); }
    .ai-void-agenda-date-secondary {
        font-size: 13px;
        font-weight: 700;
        color: #C7D2FE;
        letter-spacing: .01em;
        text-shadow: 0 0 12px rgba(129, 140, 248, 0.35);
    }
    .ai-void-agenda-date-tertiary {
        font-size: 11px;
        font-weight: 600;
        color: rgba(196, 181, 253, 0.78);
        letter-spacing: .02em;
        margin-top: 1px;
    }
    .ai-void-agenda-age { font-size: 10px; color: rgba(251,191,36,.75); margin-top: 3px; font-weight: 600; }

    /* ---- یک ردیفِ فشردهٔ سن به‌جای چهار خطِ همیشه‌بازِ قبلی — پیش‌فرض بسته ---- */
    .ai-void-agenda-age-toggle {
        display: flex; align-items: center; justify-content: space-between; gap: 6px;
        width: 100%; margin-top: 6px; padding: 0; border: none; background: none;
        font-family: inherit; cursor: pointer; text-align: start;
        color: rgba(251, 191, 36, 0.8);
    }
    .ai-void-agenda-age-toggle:hover { color: rgba(251, 191, 36, 1); }
    .ai-void-agenda-age-summary { font-size: 10px; font-weight: 600; }
    .ai-void-agenda-age-caret {
        font-size: 8px; opacity: .55; transition: transform 0.18s ease;
        transform: rotate(-90deg);
    }
    .ai-void-agenda-age-toggle.is-open .ai-void-agenda-age-caret { transform: rotate(0deg); }

    .ai-void-agenda-age-detail {
        margin-top: 5px; display: flex; flex-direction: column; gap: 4px;
        animation: voidFamilyOpen 0.22s ease;
    }
    .ai-void-agenda-birth {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        letter-spacing: 0.15px;
        line-height: 1.4;
    }
    .ai-void-agenda-birth-j {
        font-size: 10px;
        font-weight: 600;
        color: rgba(167, 243, 208, 0.9);
        direction: rtl;
    }
    .ai-void-agenda-birth-g {
        font-size: 9.5px;
        font-weight: 600;
        color: rgba(186, 230, 253, 0.78);
        direction: ltr;
    }
    .ai-void-agenda-family {
        display: flex; flex-direction: column; gap: 3px;
    }
    @keyframes voidFamilyOpen {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .ai-void-agenda-family-row {
        font-size: 9.5px; color: rgba(199,210,254,.75); text-align: center; font-weight: 600;
        padding: 3px 6px; border-radius: 6px; background: rgba(255,255,255,0.03);
    }
    .ai-void-agenda-family-row.is-primary {
        color: #A7F3D0; background: rgba(16,185,129,.1);
    }

    /* ---- «خط عمر» — دیگر بخشِ متنیِ سن نیست: یک جداکنندهٔ همیشه‌دیدنی و
       جذاب بینِ بلوکِ تقویم/سن و رویدادها/کارهای زیرش. جایگزینِ همان
       border-bottom ساده‌ای که قبلاً روی خودِ .ai-void-agenda-datehead بود؛
       بدونِ سالِ تولد هم .ai-void-agenda-divider همون نقش رو با یک خطِ ساده
       بازی می‌کند تا لایوت نپرد. ---- */
    .ai-void-agenda-lifeline {
        margin-top: 10px; padding-top: 8px;
        border-top: 1px solid rgba(255,255,255,.06);
    }
    .ai-void-agenda-lifeline-track {
        height: 5px; border-radius: 999px;
        background: rgba(255,255,255,.06);
        overflow: hidden;
        box-shadow: 0 0 10px rgba(124, 106, 242, 0.18);
    }
    .ai-void-agenda-lifeline-fill {
        height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #7c6af2, #FBBF24);
        box-shadow: 0 0 8px rgba(251, 191, 36, 0.45);
    }
    .ai-void-agenda-divider {
        margin-top: 10px;
        border-top: 1px solid rgba(255,255,255,.08);
    }
    .ai-void-agenda-mark-line {
        font-size: 10.5px; color: rgba(199,210,254,.7);
        margin-top: 5px; direction: auto; text-align: start;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ai-void-agenda-mark-line.is-today { color: #FDE68A; font-weight: 700; }
    .ai-void-agenda-section-title {
        font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
        color: rgba(199,210,254,.55); margin-bottom: 5px;
    }
    .ai-void-agenda-events { display: grid; gap: 4px; }
    .ai-void-todo-list { display: grid; gap: 3px; }
    .ai-void-event-row {
        display: flex; align-items: baseline; gap: 8px;
        padding: 5px 7px; border-radius: 7px;
        background: rgba(255,255,255,.03);
        font-size: 11.5px;
        cursor: pointer;
        transition: background .15s ease;
    }
    .ai-void-event-row:hover { background: rgba(255,255,255,.065); }
    .ai-void-event-time {
        font-family: 'SF Mono', Consolas, monospace;
        font-weight: 700; flex: 0 0 auto;
        color: rgba(251,191,36,.85);
    }
    .ai-void-event-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: auto; text-align: start; color: #EEF2FF; }
    .ai-void-event-time {
        cursor: pointer;
        border-radius: 4px;
        padding: 0 2px;
        transition: background .15s ease;
    }
    .ai-void-event-time:hover { background: rgba(251,191,36,.16); }
    .ai-void-event-time-input {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 11.5px;
        font-weight: 700;
        color: #0F172A;
        background: #FBBF24;
        border: 0; border-radius: 4px;
        padding: 0 2px;
        width: 58px;
        flex: 0 0 auto;
    }
    .ai-void-event-del {
        flex: 0 0 auto;
        width: 16px; height: 16px;
        border: 0; border-radius: 5px;
        background: transparent; color: rgba(255,255,255,.35);
        font-size: 12px; line-height: 1;
        cursor: pointer;
        margin-inline-start: auto;
        opacity: 0;
        transition: opacity .15s ease, background .15s ease, color .15s ease;
    }
    .ai-void-event-row:hover .ai-void-event-del,
    .ai-void-event-row:focus-within .ai-void-event-del { opacity: 1; }
    .ai-void-event-del:hover { background: rgba(239,68,68,.85); color: #fff; }
    .ai-void-event-row.is-near { background: rgba(251,191,36,.1); }
    .ai-void-event-row.is-near .ai-void-event-time { text-shadow: 0 0 8px rgba(251,191,36,.65); }
    .ai-void-event-row.is-missed .ai-void-event-time { text-decoration: line-through; opacity: .55; }
    .ai-void-event-row.is-missed .ai-void-event-title { color: #FCA5A5; }
    .ai-void-event-row.is-done { opacity: .5; }
    .ai-void-event-row.is-done .ai-void-event-title { text-decoration: line-through; }
    .ai-void-event-row.is-recurring-elapsed { opacity: .6; }
    .ai-void-event-badge {
        flex: 0 0 auto; font-size: 8.5px; font-weight: 700;
        padding: 1px 6px; border-radius: 999px;
        background: linear-gradient(135deg, #FDE68A, #FBBF24); color: #0F172A;
    }
    .ai-void-event-empty, .ai-void-todo-empty { padding: 10px 5px; color: rgba(224,231,255,.5); font-size: 11px; text-align: center; }
    /* پیش‌نمایشِ فشردهٔ فردا — همان زبانِ بصریِ کادرِ داشبوردِ اصلی، در اندازهٔ داک */
    .ai-void-tomorrow-box {
        margin-top: 4px; padding: 6px 8px;
        border: 1px dashed rgba(251,191,36,.28);
        border-radius: 8px;
        background: rgba(251,191,36,.04);
        cursor: pointer;
    }
    .ai-void-tomorrow-box:hover { background: rgba(251,191,36,.08); }
    .ai-void-tomorrow-head { font-size: 9.5px; font-weight: 700; color: rgba(251,191,36,.75); text-transform: uppercase; letter-spacing: .04em; }
    .ai-void-tomorrow-row { display: flex; gap: 6px; font-size: 10.5px; color: rgba(255,255,255,.62); margin-top: 3px; }
    .ai-void-tomorrow-row .ai-void-event-time { font-size: 10px; }
    .ai-void-todo-row {
        display: flex; align-items: flex-start; min-width: 0; gap: 8px;
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgba(255,255,255,.03);
        color: inherit;
        font: 12px/1.35 system-ui, sans-serif;
        text-align: start; cursor: pointer;
        transition: background .15s ease, border-color .15s ease, box-shadow .18s ease;
    }
    .ai-void-todo-row:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.06); }
    .ai-void-todo-check {
        width: 16px; height: 16px; flex: 0 0 16px;
        margin-top: 1px;
        display: grid; place-items: center;
        border: 1px solid rgba(199,210,254,.58);
        border-radius: 5px; color: white; font-size: 11px;
    }
    .ai-void-todo-row.done { opacity: .5; }

    /* کارهای پیوندی به هدف — طلایی لطیف */
    .ai-void-todo-row.is-linked {
      border: 1px solid rgba(212, 160, 23, 0.22);
      border-inline-start: 2px solid rgba(212, 160, 23, 0.5);
      background: linear-gradient(90deg, rgba(212, 160, 23, 0.09), transparent 60%);
      box-shadow: inset 0 1px 0 rgba(253, 230, 138, 0.05);
    }
    .ai-void-todo-row.is-linked:hover {
      border-color: rgba(212, 160, 23, 0.32);
      background: linear-gradient(90deg, rgba(212, 160, 23, 0.12), transparent 60%);
    }
    .ai-void-todo-row.is-linked .ai-void-todo-text {
      color: rgba(253, 230, 138, 0.88);
      font-weight: 550;
    }
    .ai-void-todo-row.is-linked.done {
      opacity: 0.65;
      border-color: rgba(212, 160, 23, 0.16);
    }
    .ai-void-todo-row.is-linked .ai-void-todo-check {
      border-color: rgba(212, 160, 23, 0.4);
      box-shadow: none;
    }
    .ai-void-todo-row.is-linked.done .ai-void-todo-check {
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.85), rgba(180, 83, 9, 0.9));
      border-color: rgba(212, 160, 23, 0.65);
    }
    .ai-void-todo-star {
      flex-shrink: 0;
      color: #E8C872;
      font-size: 12px;
      line-height: 1;
      text-shadow: 0 0 5px rgba(212, 160, 23, 0.35);
    }
    .ai-void-todo-impact {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: rgba(253, 230, 138, 0.92);
      background: rgba(212, 160, 23, 0.14);
      border: 1px solid rgba(212, 160, 23, 0.3);
      border-radius: 6px;
      padding: 2px 6px;
      box-shadow: none;
      letter-spacing: 0.02em;
    }

    .ai-void-todo-row.done .ai-void-todo-check { background: #10B981; border-color: #10B981; }
    .ai-void-todo-row.done .ai-void-todo-text { text-decoration: line-through; }
    .ai-void-todo-text {
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        min-width: 0;
    }
    .ai-void-todo-empty { padding: 16px 5px; color: rgba(224,231,255,.5); font-size: 11px; text-align: center; }

    /* دیگه بخشِ داخلیِ داک نیست — یه کارتِ مستقلِ شیشه‌ای، هم‌خانواده با
       ظاهرِ #ai-void-echo (همون رادیوس/بوردر/بلور)، زیرِ Today's Echo. */

    .ai-void-goals-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
    }
    .ai-void-goals-head .ai-void-agenda-section-title {
        flex: 1 1 auto;
        margin-bottom: 0;
    }
    .ai-void-agenda-section.is-goals {
        width: 100%; max-width: 520px; border-radius: 16px;
        margin-top: 0; padding: 6px 4px 0;
    }
    .ai-void-agenda-section.is-goals[hidden] { display: none !important; }
    /* بدونِ background/border/blur قبلی، عنوان و دکمهٔ سیاه‌چاله مستقیم رویِ
       استارفیلد می‌نشینن — یه سایه براشون لازمه تا رویِ زمینه‌های روشن هم
       خوانا بمونن (همون تکنیکِ بقیهٔ متن‌های شناورِ این صفحه). */
    .ai-void-goals-head .ai-void-agenda-section-title,
    .ai-void-goals-head .ai-void-dissolve-btn {
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        filter: drop-shadow(0 1px 4px rgba(0, 0, 0, 0.5));
    }
    .ai-void-goals-overflow {
        grid-column: 1 / -1;
        text-align: center;
        font-size: 9.5px;
        color: rgba(199, 210, 254, 0.55);
        padding-top: 2px;
    }
    .ai-void-goals-overflow strong { color: rgba(251, 191, 36, 0.75); }
    /* همون گاردِ دومِ ai-void-todo-dock، برای Goals هم — همون ریسکِ رِیس رو
       با همون منطق داره (applyDockVisibility روی هر دو با هم تصمیم
       می‌گیره)، پس همون تضمینِ CSSی رو هم لازم داره. */
    .ai-void-agenda-section.is-goals[data-void-boot-dissolved="1"] { display: none !important; }
    .ai-void-agenda-section.is-goals .ai-void-agenda-section-title {
        color: rgba(196, 181, 253, 0.85);
    }
    /* دیگه هیچ اسکرولِ داخلی/max-height ای اینجا نیست: چون لیست حالا سقفِ
       سختِ ۶ هدف دارد (renderTodos در void-tab-todo.js)، گرید همیشه به‌اندازهٔ
       محتوایِ واقعی‌اش قد می‌کشد — هیچ کارتی توسطِ کادرِ خودش بریده نمی‌شود. */
    .ai-void-goals-list.ai-void-todo-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        align-items: start;
        gap: 8px;
        padding: 2px;
    }

    /* ── Goal progress card ── */
    .ai-void-goal-card {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 9px 10px 10px;
        border-radius: 11px;
        border: 1px solid rgba(167, 139, 250, 0.28);
        background:
          linear-gradient(155deg, rgba(15, 12, 41, 0.55), rgba(48, 43, 99, 0.22) 45%, rgba(251, 191, 36, 0.06));
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.06) inset,
          0 6px 18px rgba(0, 0, 0, 0.22);
        transition: border-color .2s ease, box-shadow .25s ease;
    }
    .ai-void-goal-card:hover {
        border-color: rgba(196, 181, 253, 0.45);
        box-shadow:
          0 0 0 1px rgba(167, 139, 250, 0.1) inset,
          0 8px 22px rgba(0, 0, 0, 0.28),
          0 0 20px rgba(124, 106, 242, 0.12);
    }
    .ai-void-goal-card.is-complete {
        border-color: rgba(251, 191, 36, 0.45);
        box-shadow:
          0 0 0 1px rgba(251, 191, 36, 0.12) inset,
          0 0 22px rgba(251, 191, 36, 0.18);
    }
    .ai-void-goal-head {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
    }
    .ai-void-goal-spark {
        flex: 0 0 auto;
        font-size: 12px;
        line-height: 1.3;
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.45));
    }
    .ai-void-goal-label {
        flex: 1 1 auto;
        min-width: 0;
        font: 600 12px/1.35 system-ui, sans-serif;
        color: #F1F5FF;
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
    }
    .ai-void-goal-card.is-complete .ai-void-goal-label {
        color: #FDE68A;
        text-shadow: 0 0 12px rgba(251, 191, 36, 0.35);
    }
    .ai-void-goal-pct {
        flex: 0 0 auto;
        font: 800 11px/1 system-ui, sans-serif;
        letter-spacing: .03em;
        padding: 3px 7px;
        border-radius: 999px;
        color: #EDE9FE;
        background: rgba(15, 12, 41, 0.65);
        border: 1px solid rgba(167, 139, 250, 0.3);
        min-width: 2.6em;
        text-align: center;
        transition: color .2s ease, border-color .2s ease, box-shadow .25s ease, background .2s ease;
    }
    .ai-void-goal-pct.is-high {
        color: #0F172A;
        background: linear-gradient(135deg, #FBBF24, #FDE68A);
        border-color: rgba(251, 191, 36, 0.7);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.45);
    }

    /* Spectrum track: darkness → violet → gold radiance */
    .ai-void-goal-slider-wrap {
        position: relative;
        height: 18px;
        display: flex;
        align-items: center;
        touch-action: none;
    }
    .ai-void-goal-slider-track {
        position: absolute;
        left: 0; right: 0;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg,
          #0B0A1A 0%,
          #1E1B4B 18%,
          #4338CA 42%,
          #A78BFA 62%,
          #FBBF24 82%,
          #FEF3C7 100%);
        box-shadow:
          inset 0 1px 2px rgba(0,0,0,.45),
          0 0 8px rgba(124, 106, 242, 0.15);
        overflow: hidden;
    }
    /* Dim veil covering the unreached portion (right side) */
    .ai-void-goal-slider-veil {
        position: absolute;
        top: 0; bottom: 0; right: 0;
        background: rgba(8, 7, 18, 0.72);
        border-radius: 0 999px 999px 0;
        pointer-events: none;
        transition: width .05s linear;
    }
    .ai-void-goal-slider {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 18px;
        margin: 0;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
    }
    .ai-void-goal-slider:focus {
        outline: none;
    }
    .ai-void-goal-slider:focus-visible::-webkit-slider-thumb {
        box-shadow:
          0 0 0 3px rgba(251, 191, 36, 0.35),
          0 0 16px rgba(251, 191, 36, 0.65);
    }
    .ai-void-goal-slider::-webkit-slider-runnable-track {
        height: 8px;
        background: transparent;
        border: none;
    }
    .ai-void-goal-slider::-moz-range-track {
        height: 8px;
        background: transparent;
        border: none;
    }
    .ai-void-goal-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -4px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        background: radial-gradient(circle at 35% 30%, #FEF3C7, #FBBF24 55%, #B45309);
        box-shadow:
          0 0 0 1px rgba(15, 12, 41, 0.5),
          0 2px 6px rgba(0,0,0,.4),
          0 0 10px rgba(251, 191, 36, 0.35);
        transition: box-shadow .15s ease, transform .12s ease;
        cursor: grab;
    }
    .ai-void-goal-slider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        background: radial-gradient(circle at 35% 30%, #FEF3C7, #FBBF24 55%, #B45309);
        box-shadow:
          0 0 0 1px rgba(15, 12, 41, 0.5),
          0 2px 6px rgba(0,0,0,.4),
          0 0 10px rgba(251, 191, 36, 0.35);
        cursor: grab;
    }
    .ai-void-goal-slider:active::-webkit-slider-thumb {
        cursor: grabbing;
        transform: scale(1.12);
        box-shadow:
          0 0 0 2px rgba(251, 191, 36, 0.35),
          0 2px 8px rgba(0,0,0,.45),
          0 0 18px rgba(251, 191, 36, 0.7);
    }
    .ai-void-goal-slider:active::-moz-range-thumb {
        cursor: grabbing;
        transform: scale(1.12);
    }
    .ai-void-goal-ends {
        display: flex;
        justify-content: space-between;
        margin-top: -2px;
        font-size: 8.5px;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: rgba(199, 210, 254, 0.35);
        user-select: none;
    }
    .ai-void-goal-ends .end-light {
        color: rgba(253, 230, 138, 0.55);
    }
    .ai-void-todo-row.is-tomorrow {
        border-color: rgba(251, 191, 36, 0.22);
        background: rgba(251, 191, 36, 0.05);
    }
    .ai-void-tomorrow-badge {
        flex: 0 0 auto;
        font-size: 8.5px;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(251, 191, 36, 0.2);
        color: #FDE68A;
        margin-inline-start: auto;
    }


    /* ---- Void Dissolve: scatter to stars + singularity toggle ---- */

    /* Dissolved menus keep their layout slot so siblings (Goals under Echo) do not jump up */
    .ai-void-is-dissolved {
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        /* keep display & dimensions — do NOT use [hidden]/display:none */
    }
    #ai-void-dissolve-layer {
        position: fixed; inset: 0; pointer-events: none; z-index: 9998;
        overflow: hidden;
    }
    .ai-void-dust {
        position: fixed;
        width: var(--sz, 3px); height: var(--sz, 3px);
        margin: calc(var(--sz, 3px) / -2) 0 0 calc(var(--sz, 3px) / -2);
        border-radius: 50%;
        background: hsl(var(--hue, 220), 90%, 78%);
        box-shadow: 0 0 8px hsl(var(--hue, 220), 100%, 70%);

    @keyframes voidDustIn {

    /* عرضِ Stage دیگه یک max-width ثابت نیست — بالاتر (تعریفِ #ai-void-stage)
       با var(--void-dock-w) به‌صورتِ فرمول محاسبه می‌شه، پس همیشه، در هر
       عرضی، دقیقاً همون فاصله‌ای که Today واقعاً لازم داره رو کنار می‌ذاره؛
       دیگه نیازی نیست چند نقطهٔ نمونه (۱۰۲۴، ۱۲۸۰، ...) رو دستی چک کنیم.
       ولی این فرمول فقط تا یه حدی جواب می‌ده: وقتی خودِ Today به کمینه‌ی
       clamp (۲۰۰px) رسیده و باز هم فضا کم بیاد، Stage آن‌قدر باریک می‌شه
       (کمتر از ~۴۶۰px) که دیگه برای نوار جستجو/لینک‌های پرکاربرد قشنگ
       نیست — این‌جاست که به‌جای فشرده‌کردنِ بیشتر، سوییچ می‌کنیم به چیدمانِ
       ستونی (که Today/Echo/Goals رو از حالتِ کناریِ fixed درمی‌آره و زیرِ
       هم می‌چینه). آستانه‌اش از همون فرمولِ بالا حساب شده: وقتی Today به
       کمینه‌اش (۲۰۰px) می‌رسه، فضای رزرو‌شده هر طرف = ۲۰۰+۱۶+۲۴=۲۴۰px،
       و Stageِ ~۴۶۰px یعنی VW ≈ ۴۶۰+۲×۲۴۰ = ۹۴۰px. */
    @media (max-width: 940px) {
        /* زیرِ این آستانه، وقتی همه‌چیز (سرچ + Frequent Links + Today + Echo
           + Goals) زیرِ هم می‌شینه، ممکنه رویِ‌همرفته از ارتفاعِ صفحه بلندتر
           بشه. چون html/body عمداً overflow:hidden هستن (برای جلوگیریِ
           اسکرولِ کلِ صفحه روی starfield) و این استیج position:fixed هست
           (پس اسکرولِ سند رو دنبال نمی‌کنه)، بدونِ این قانون هر بخشی که از
           ویوپورت رد بشه (مثلِ Goals، چون آخرین آیتمه) کاملاً غیرِقابل‌
           دسترسی می‌موند — نه پنهان به‌خاطرِ منطقِ برنامه، فقط بیرون از دیدِ
           صفحه.
           Today (#ai-void-todo-dock) از نظرِ DOM دیگه همین‌جا، بینِ
           Frequent Links و Echo، زندگی می‌کنه (نه یه <aside>ی مستقلِ
           position:fixed بعدِ Stage). روی پنجره‌های بزرگ‌تر (بیرونِ این
           مدیا کوئری) همچنان position:fixed می‌مونه و جای DOM هیچ اثرِ
           دیداری نداره؛ فقط این‌جا با position:static به‌جای این‌که یک
           overlayِ شناور باشه و با بازشدن، روی Echo/Goals بیفته، خودش هم
           یک عضوِ عادیِ همین ستونِ اسکرول‌شونده می‌شه — پس دیگه به‌تعریف
           نمی‌تونه روی چیزِ دیگه‌ای بیفته. */
        #ai-void-stage {
            top: max(64px, 12vh); width: calc(100vw - 24px); gap: 14px;
            max-height: calc(100vh - max(64px, 12vh) - 24px);
            overflow-y: auto; overscroll-behavior: contain;
            scrollbar-width: thin; scrollbar-color: rgba(165, 180, 252, .3) transparent;
            padding-bottom: 12px;
        }
        #ai-void-stage::-webkit-scrollbar { width: 6px; }
        #ai-void-stage::-webkit-scrollbar-track { background: transparent; }
        #ai-void-stage::-webkit-scrollbar-thumb { background: rgba(165, 180, 252, .28); border-radius: 999px; }
        #ai-void-todo-dock {
            position: static !important; top: auto !important; bottom: auto !important;
            left: auto !important; right: auto !important; transform: none !important;
            width: 100%; max-width: none;
        }
        /* زیرِ ۹۴۰px، لینک‌های پرکاربرد مخفی می‌شوند تا فضا برای Today/Echo/
           Goals باز باشد؛ به‌محضِ رسیدنِ عرض به بالای همین آستانه (پنجره را
           بزرگ کنید یا موبایل نباشد)، دوباره ظاهر می‌شوند — چون این فقط یک
           display:none شرطی است، نه حذفِ داده؛ هیچ لینکی گم نمی‌شود. */
        #ai-ntp-topsites {
            display: none;
        }
        #ai-ntp-quickbar, #ai-ntp-quickbar[data-side="left"], #ai-ntp-quickbar[data-side="right"] {
            left: auto !important; right: 14px !important;
        }
    }
    /* این یکی صرفاً ظاهریه (اندازهٔ فونتِ برندِ سرچ روی گوشی) — چیدمانِ
       ستونی بالا این‌جا نیست، چون از ۹۴۰px به پایین از قبل فعاله. */
    @media (max-width: 700px) {
        #ai-void-search-brand-name { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
        .ai-void-search-brand-pulse { animation: none; }
        #ai-ntp-quickbar { transition: none; }
    }

</style>
  <link rel="stylesheet" href="void-music.css">
  <link rel="preload" as="image" href="assets/engines/google.svg">
  <link rel="preload" as="image" href="assets/engines/bing.svg">
  <link rel="preload" as="image" href="assets/engines/duckduckgo.svg">
  <link rel="preload" as="image" href="assets/engines/brave.svg">
</head>

<body>

<canvas id="starfield"></canvas>
<div class="space-vignette"></div>

<div id="ai-ntp-quickbar" role="toolbar" aria-label="Page controls">
  <button type="button" id="ai-ntp-music-btn" title="Music Mode" aria-label="Music Mode">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 17V6.5L18 4.5V15"/><path d="M9 17a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/><path d="M18 15a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"/></svg>
  </button>
  <button type="button" id="ai-ntp-fs-btn" title="Full screen" aria-label="Full screen" aria-pressed="false" data-on="0">
    <svg class="fs-in" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="fs-out" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>
  <div id="ai-ntp-menu">
    <button type="button" id="ai-ntp-menu-btn" title="Menu" aria-haspopup="menu" aria-expanded="false">☰</button>
    <div id="ai-ntp-menu-panel" role="menu">
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-focus">
        <span>🎯 <span id="ai-ntp-menu-focus-label">Focus Mode</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-topsites" data-on="1">
        <span>🔗 <span id="ai-ntp-menu-topsites-label">Frequent Links</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-echo" data-on="1">
        <span>◌ <span id="ai-ntp-menu-echo-label">Today's Echo</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-todo" data-on="1">
        <span>◐ <span id="ai-ntp-menu-todo-label">Today Task</span></span>
        <span class="ai-ntp-menu-check">✓</span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-settings">
        <span>⚙️ <span id="ai-ntp-menu-settings-label">Settings</span></span>
        <span class="ai-ntp-menu-check"></span>
      </button>
      <button type="button" class="ai-ntp-menu-item" id="ai-ntp-menu-stdtab">
        <span>🌐 <span id="ai-ntp-menu-stdtab-label">Use Standard New Tab</span></span>
        <span class="ai-ntp-menu-check"></span>
      </button>
    </div>
  </div>
  <div id="ai-ntp-apps-wrap">
    <button type="button" id="ai-ntp-apps-btn" title="Apps" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" width="17" height="17">
        <circle cx="12" cy="12" r="4.1" fill="currentColor" stroke="none"></circle>
        <ellipse cx="12" cy="12" rx="9.6" ry="3.1" transform="rotate(-20 12 12)"></ellipse>
      </svg>
    </button>
    <div id="ai-ntp-apps-panel" role="menu" aria-label="Apps">
      <div id="ai-void-apps" aria-label="App shortcuts"></div>
      <a id="ai-ntp-account" role="menuitem" href="https://accounts.google.com/AccountChooser?continue=https%3A%2F%2Fmyaccount.google.com%2F" target="_blank" rel="noopener" title="Switch account">◉</a>
    </div>
  </div>
</div>



<section id="ai-void-stage">
  <div id="ai-void-search" dir="ltr" aria-label="Web search">
    <div class="ai-void-search-brand-row">
      <button type="button" class="ai-void-search-nav" id="ai-void-search-prev" title="Previous engine" aria-label="Previous search engine">‹</button>
      <div id="ai-void-search-brand" data-engine="google" title="Swipe or click to switch engine">
        <a class="ai-void-search-brand-mark" data-engine="google"
           href="https://www.google.com/" target="_blank" rel="noopener noreferrer"
           aria-label="Open Google">
          <img class="mark" data-mark="google" src="assets/engines/google.svg" width="24" height="24" alt="" draggable="false" decoding="async" />
          <img class="mark" data-mark="bing" src="assets/engines/bing.svg" width="24" height="24" alt="" draggable="false" decoding="async" />
          <img class="mark" data-mark="duckduckgo" src="assets/engines/duckduckgo.svg" width="24" height="24" alt="" draggable="false" decoding="async" />
          <img class="mark" data-mark="brave" src="assets/engines/brave.svg" width="24" height="24" alt="" draggable="false" decoding="async" />
          <svg class="mark" data-mark="generic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16" fill="none" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </a>
        <span id="ai-void-search-brand-name">Google</span>
      </div>
      <button type="button" class="ai-void-search-nav" id="ai-void-search-next" title="Next engine" aria-label="Next search engine">›</button>
    </div>
    <form class="ai-void-search-box" id="ai-void-search-form" action="#">
      <svg class="ai-void-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="ai-void-search-input" name="q" autocomplete="off" spellcheck="false" dir="auto" placeholder="Search with Google…" />
      <button type="button" id="ai-void-search-mode" hidden aria-pressed="false" title="Toggle AI Mode">
        <span class="ai-mode-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 8.2c1.4 0 2.6.8 3.2 2"/>
          </svg>
        </span>
        <span class="ai-mode-label">AI</span>
        <span class="ai-mode-state">Off</span>
      </button>
      <button type="button" id="ai-void-search-go" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/>
          <path d="M16.2 16.2L21 21"/>
        </svg>
      </button>
    </form>
    <div id="ai-void-search-dots" role="tablist" aria-label="Search engines"></div>
  </div>

  <div id="ai-ntp-topsites"></div>

  <!-- Today این‌جا، بینِ لینک‌های پرکاربرد و اکو، زندگی می‌کنه (نه
       دیگه به‌صورتِ <aside>ی مستقل بعدِ Stage) تا روی موبایل
       (@media max-width:700px) با یک position:static ساده در همون
       ستونِ اسکرول‌شوندهٔ Stage بشینه، به‌جای این‌که به‌عنوانِ یک
       overlay مستقلِ position:fixed با Echo/Goals تصادم کنه. رویِ
       دسکتاپ چون CSS همچنان position:fixed می‌ذاره، جای DOM هیچ اثرِ
       دیداری نداره — فقط ترتیبِ موبایل رو کنترل می‌کنه. -->
  <aside id="ai-void-todo-dock" class="is-collapsed" data-side="left" aria-label="Today">
  <div class="ai-void-todo-head" id="ai-void-todo-handle" role="button" tabindex="0" aria-expanded="false" title="Show / hide">
    <span>◐</span><span class="ai-void-todo-title" id="ai-void-todo-title">Today</span><span class="ai-void-todo-count" id="ai-void-todo-count"></span>
    <span class="ai-void-todo-chevron" id="ai-void-todo-chevron" aria-hidden="true">▾</span>
    <button type="button" class="ai-void-dissolve-btn" id="ai-void-todo-dissolve" title="Dissolve into stars">◎</button>
    <button type="button" class="ai-void-todo-side" id="ai-void-todo-side" title="Move to other side">↔</button>
  </div>
  <div class="ai-void-agenda-body" id="ai-void-agenda-body">
    <div class="ai-void-agenda-datehead" id="ai-void-agenda-datehead"></div>
    <div class="ai-void-agenda-section">
      <div class="ai-void-agenda-section-title" id="ai-void-agenda-events-title"></div>
      <div class="ai-void-agenda-events" id="ai-void-agenda-events"></div>
    </div>
    <div class="ai-void-agenda-section">
      <div class="ai-void-agenda-section-title" id="ai-void-agenda-tasks-title"></div>
      <div class="ai-void-todo-list" id="ai-void-todo-list"></div>
    </div>
    <div class="ai-void-report-bar" id="ai-void-report-bar">
      <div class="ai-void-report-row">
        <span class="ai-void-report-label" id="ai-void-report-label">Share report</span>
        <button type="button" id="ai-void-report-copy" class="ai-void-report-copy" title="Copy report">⎘</button>
        <button type="button" id="ai-void-report-txt" class="ai-void-report-txt" title="Download .txt">⬇</button>
      </div>
      <div class="ai-void-report-hint" id="ai-void-report-hint" aria-live="polite"></div>
    </div>
  </div>
</aside>

  <div id="ai-void-echo" class="is-collapsed" hidden aria-live="polite">
    <div class="ai-void-echo-handle" id="ai-void-echo-handle" role="button" tabindex="0" aria-expanded="false" title="Show / hide">
      <span class="ai-void-echo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
          <path d="M7.5 12a4.5 4.5 0 0 1 9 0"/>
          <path d="M4.5 12a7.5 7.5 0 0 1 15 0" opacity="0.65"/>
          <path d="M2 12a10 10 0 0 1 20 0" opacity="0.35"/>
        </svg>
      </span>
      <span class="ai-void-echo-title" id="ai-void-echo-title">Today's Echo</span>
      <span class="ai-void-echo-count" id="ai-void-echo-count" hidden></span>
      <span class="ai-void-echo-chevron" id="ai-void-echo-chevron" aria-hidden="true">▾</span>
      <button type="button" class="ai-void-dissolve-btn" id="ai-void-echo-dissolve" title="Dissolve into stars">◎</button>
    </div>
    <div class="ai-void-echo-content">
      <div class="ai-void-echo-body" id="ai-void-echo-body"></div>
      <div class="ai-void-echo-pattern" id="ai-void-echo-pattern" hidden></div>
    </div>
  </div>

  <!-- Goals stays independent from Today's Echo and remains available when empty,
       so its dissolve control can restore it and complete a constellation. -->
  <div class="ai-void-agenda-section is-goals" id="ai-void-agenda-goals-section" hidden>
    <div class="ai-void-goals-head">
      <div class="ai-void-agenda-section-title" id="ai-void-agenda-goals-title"></div>
      <button type="button" class="ai-void-dissolve-btn" id="ai-void-goals-dissolve" title="Dissolve into stars">◎</button>
    </div>
    <div class="ai-void-todo-list ai-void-goals-list" id="ai-void-goals-list"></div>
  </div>
</section>

<div id="ai-void-profile-dialog" role="dialog" aria-modal="true" aria-labelledby="ai-void-profile-title">
  <div class="ai-void-profile-card">
    <h3 id="ai-void-profile-title">Gmail profile</h3>
    <label for="ai-void-profile-label">Label</label>
    <input id="ai-void-profile-label" type="text" maxlength="24" placeholder="Work, Personal…" autocomplete="off" />
    <label for="ai-void-profile-url">URL</label>
    <input id="ai-void-profile-url" type="url" dir="ltr" placeholder="https://mail.google.com/mail/u/0/" autocomplete="off" />
    <div class="ai-void-profile-actions">
      <button type="button" class="ai-void-profile-delete" id="ai-void-profile-delete" hidden>Delete</button>
      <button type="button" class="ai-void-profile-cancel" id="ai-void-profile-cancel">Cancel</button>
      <button type="button" class="ai-void-profile-save" id="ai-void-profile-save">Save</button>
    </div>
  </div>
</div>
